# 复制为 config/stats.toml 后填写（该文件建议 gitignore，勿提交密钥）。
# 遗留根目录 .env 仍可只读合并，优先级低于本文件。

[bootstrap]
host = "0.0.0.0"
port = 8099
db_path = "data/stats.db"

# 心跳鉴权：留空=公开写入（配合限流）；非空则须 Bearer
heartbeat_token = ""

# 公开写入时限流（仅 heartbeat_token 为空时生效）
heartbeat_rate_per_ip_per_min = 60
heartbeat_min_interval_sec = 30.0

online_ttl_sec = 900
max_clock_skew_sec = 300

# 语料 API（Bot 外接）；见 docs/API.md § 语料 API
# 社区投稿墙：见 docs/API.md § 社区投稿
[env]
CORPUS_ENABLED = "true"
CORPUS_PUBLIC_API_BASE = "https://stats.pallasbot.top/v1/corpus"
CORPUS_DEFAULT_CONTRIBUTE = "true"
CORPUS_ENROLL_REQUIRES_HEARTBEAT_TOKEN = "false"

# GALLERY_ENABLED = "true"
# GALLERY_MEDIA_DIR = "data/gallery"
# GALLERY_PER_HOUR = "30"
# GALLERY_PER_DAY = "10"

# 多实例 + 公开写入：启用 Redis 分布式限流
# REDIS_URL = "redis://127.0.0.1:6379/1"
# STATS_REDIS_RATE_LIMIT_ENABLED = "auto"

# 联邦 bootstrap（Bot 拉取 federate_id + 协调 Redis；须 INSTANCE_SECRET）
# BOOTSTRAP_ENABLED = "true"
# INSTANCE_SECRET = "change-me"
# FEDERATE_ID = "public-pool"
# 公网示例（须 DNS A 记录 coord.pallasbot.top → 中心机 IP，安全组放行 6380/tcp）
# FEDERATE_COORD_REDIS_URL = "redis://:<url-encoded-password>@coord.pallasbot.top:6380/2"
# 密码见 config/redis.coord.env（REDIS_COORD_PASSWORD），勿提交 git
# FEDERATE_REDIS_PREFIX = "pallas:fed:public-pool"
# FEDERATE_CLAIM_TTL_SEC = "86400"

# 控制台「统计与语料」页展示的 Phase 2 入池说明（公开 GET /v1/federation/onboarding）
# FEDERATION_ONBOARDING_ENABLED = "true"
# FEDERATION_ONBOARDING_PUBLISH_SECRET = "true"
