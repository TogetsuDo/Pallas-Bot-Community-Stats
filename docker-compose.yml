services:
  stats:
    build: .
    ports:
      - "${PORT:-8099}:8099"
    volumes:
      - ./config/stats.toml:/app/config/stats.toml:ro
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
