# 生产默认：拉取预构建镜像，仅本机暴露 8099（前置 Nginx/Caddy 提供 HTTPS）
name: pallas-community-stats

services:
  stats:
    image: togetsudo/pallas-community-stats:${IMAGE_TAG:-latest}
    container_name: pallas-community-stats
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8099}:8099"
    volumes:
      - ./config/stats.toml:/app/config/stats.toml:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    # 联邦 bootstrap + 协调 Redis：在 config/stats.toml [env] 配置 BOOTSTRAP_ENABLED、FEDERATE_COORD_REDIS_URL 等；
    # 启用 compose profile redis 时示例：FEDERATE_COORD_REDIS_URL=redis://redis:6379/2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
