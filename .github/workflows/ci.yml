name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
      # 部署场景：镜像装 redis extra，硬断言全部安全下限（默认 dev 场景由 pytest 覆盖核心下限）
      - run: uv sync --group dev --extra redis
      - run: uv run python scripts/verify_deployment_env.py
