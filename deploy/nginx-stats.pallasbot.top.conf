# 独立子域反代社区统计中心（推荐）
# 用法：
#   cp deploy/nginx-stats.pallasbot.top.conf /etc/nginx/sites-available/stats.pallasbot.top
#   ln -sf /etc/nginx/sites-available/stats.pallasbot.top /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d stats.pallasbot.top
#
# 后端：docker compose 监听 127.0.0.1:8099（见仓库 docker-compose.yml）
# 覆盖：/health、/v1/stats、/v1/heartbeat、/v1/corpus/*

upstream pallas_community_stats {
    server 127.0.0.1:8099;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.pallasbot.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.pallasbot.top;

    # certbot --nginx -d stats.pallasbot.top 会自动写入下面两行；手签证书时自行替换路径
    # ssl_certificate     /etc/letsencrypt/live/stats.pallasbot.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.pallasbot.top/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://pallas_community_stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
