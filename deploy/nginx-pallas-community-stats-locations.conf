# 粘贴到 pallas.togetsudo.com 的 server { listen 443 ssl; ... } 内、location / 之前。
# 反代本机社区统计服务（docker 127.0.0.1:8099）；备案完成前 Bot 可改走此 HTTPS 入口。

    location = /v1/heartbeat {
        proxy_pass http://127.0.0.1:8099/v1/heartbeat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location = /v1/stats {
        proxy_pass http://127.0.0.1:8099/v1/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
